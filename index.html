<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Johan v26.1: King's Edition</title>
    <style>
        :root { --bg: #050505; --neon: #00ffcc; --text: #d1d1d1; --accent: #bb86fc; --dark: #111; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        #sidebar { width: 400px; background: var(--dark); padding: 20px; border-right: 1px solid #333; display: flex; flex-direction: column; gap: 20px; }
        .panel { background: #161616; padding: 15px; border-radius: 10px; border: 1px solid #222; }
        #heatmap { height: 350px; overflow-y: auto; background: #000; padding: 10px; border: 1px solid #333; font-family: monospace; font-size: 11px; }
        #chat { flex: 1; display: flex; flex-direction: column; padding: 30px; background: #0a0a0a; }
        #log { flex: 1; overflow-y: auto; background: rgba(0,0,0,0.4); border-radius: 15px; padding: 20px; margin-bottom: 20px; border: 1px solid #222; }
        .msg { margin-bottom: 15px; padding: 12px; border-radius: 10px; line-height: 1.4; }
        .user { background: #1a1a1a; color: var(--neon); align-self: flex-end; border: 1px solid #333; }
        .ai { background: #121212; color: var(--accent); align-self: flex-start; border: 1px solid #333; font-weight: 500; }
        input { background: #000; color: var(--neon); border: 1px solid #333; padding: 18px; border-radius: 10px; width: 100%; box-sizing: border-box; font-size: 16px; outline: none; }
        button { background: var(--neon); color: black; border: none; padding: 0 30px; border-radius: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div id="sidebar">
    <h2 style="color: var(--neon); margin: 0;">👑 JOHAN v26.1</h2>
    <div class="panel">
        <div id="heatmap">Brain Activity...</div>
    </div>
    <button onclick="location.reload()" style="background:#333; color:white;">RESET ENGINE</button>
</div>

<div id="chat">
    <div id="log"></div>
    <div style="display:flex; gap:10px;">
        <input type="text" id="user-in" placeholder="Speak, King..." onkeypress="if(event.key==='Enter') generate()">
        <button onclick="generate()">FIRE</button>
    </div>
</div>

<script>
    window.brainWeights = {};
    const temp = 0.8;

    window.bulkLearn = function(data) {
        data.forEach(t => {
            let toks = t.toLowerCase().replace(/([.!?])/g, " $1 ").split(/\s+/).filter(w=>w);
            for (let n = 1; n <= 5; n++) {
                for (let i = 0; i <= toks.length - n; i++) {
                    let ctx = toks.slice(i, i + n).join("_");
                    let next = toks[i + n];
                    if (next) {
                        if (!window.brainWeights[ctx]) window.brainWeights[ctx] = {};
                        window.brainWeights[ctx][next] = (window.brainWeights[ctx][next] || 0) + 5;
                    }
                }
            }
        });
        updateHeatmap();
    };

    function generate() {
        let input = document.getElementById('user-in').value.toLowerCase().trim();
        if(!input) return;
        addLog("User", input);
        
        let tokens = input.replace(/([.!?])/g, " $1 ").split(/\s+/).filter(w => w);
        let res = [];
        let memory = tokens.slice(-5);

        for (let i = 0; i < 20; i++) {
            let picked = null;
            for (let size = Math.min(memory.length, 5); size >= 1; size--) {
                let key = memory.slice(-size).join("_");
                let options = window.brainWeights[key] || {};
                let choices = Object.keys(options);
                
                if (choices.length > 0) {
                    let total = 0;
                    let weighted = choices.map(word => {
                        let w = Math.pow(options[word], 1 / temp);
                        total += w; return { word, w };
                    });
                    let r = Math.random() * total;
                    let s = 0;
                    for (let item of weighted) {
                        s += item.w;
                        if (r <= s) { picked = item.word; break; }
                    }
                }
                if (picked) break;
            }

            if (!picked && i === 0) {
                let fallback = tokens[tokens.length-1];
                if(window.brainWeights[fallback]) picked = Object.keys(window.brainWeights[fallback])[0];
            }

            if (picked) {
                res.push(picked);
                if (".!?".includes(picked)) break;
                memory.push(picked);
                if (memory.length > 5) memory.shift();
            } else break;
        }

        let out = res.join(" ").replace(/\s+([.!?])/g, "$1");
        addLog("Johan", out.charAt(0).toUpperCase() + out.slice(1) || "...");
        document.getElementById('user-in').value = "";
        updateHeatmap();
    }

    function addLog(s, t) {
        let l = document.getElementById('log');
        let d = document.createElement('div');
        d.className = `msg ${s.toLowerCase()}`;
        d.innerHTML = `<strong>${s.toUpperCase()}</strong><br>${t}`;
        l.appendChild(d); l.scrollTop = l.scrollHeight;
    }

    function updateHeatmap() {
        let h = document.getElementById('heatmap'); h.innerHTML = "";
        Object.keys(window.brainWeights).slice(-40).forEach(k => {
            for(let n in window.brainWeights[k]) h.innerHTML += `<div>${k.replace(/_/g,' ')} → ${n}</div>`;
        });
    }
</script>
</body>
</html>
