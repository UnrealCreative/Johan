<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Johan v25.5: grown man with a mustahce edition</title>
    <style>
        :root { --bg: #050505; --neon: #00ffcc; --text: #d1d1d1; --accent: #bb86fc; --dark: #111; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        #sidebar { width: 400px; background: var(--dark); padding: 15px; border-right: 1px solid #333; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .panel { background: #161616; padding: 10px; border-radius: 6px; border: 1px solid #222; }
        .panel-label { font-size: 9px; color: #888; text-transform: uppercase; margin-bottom: 5px; display: block; font-weight: bold; }
        #heatmap { height: 300px; overflow-y: auto; background: #000; padding: 8px; border: 1px solid #333; font-family: monospace; font-size: 10px; }
        #chat { flex: 1; display: flex; flex-direction: column; padding: 20px; background: #0a0a0a; }
        #log { flex: 1; overflow-y: auto; background: rgba(0,0,0,0.5); border-radius: 8px; padding: 15px; margin-bottom: 15px; border: 1px solid #222; }
        .msg { margin-bottom: 10px; padding-left: 10px; border-left: 3px solid #444; }
        .user { border-left-color: var(--neon); color: var(--neon); }
        .ai { border-left-color: var(--accent); color: var(--accent); font-weight: bold; }
        input { background: #000; color: var(--neon); border: 1px solid #333; padding: 15px; font-family: monospace; border-radius: 8px; width: 100%; box-sizing: border-box; font-size: 16px; }
        button { background: var(--neon); color: black; border: none; padding: 10px 20px; border-radius: 4px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div id="sidebar">
    <h3 style="color: var(--neon); margin: 0;">🧠 JOHAN v25.5</h3>
    <div class="panel">
        <span class="panel-label">🔥 Heatmap</span>
        <div id="heatmap">No data...</div>
    </div>
    <button onclick="window.location.reload()" style="background:#444; color:white;">🔄 Refresh & Wipe</button>
</div>

<div id="chat">
    <div id="log"></div>
    <div style="display:flex; gap:10px;">
        <input type="text" id="user-in" placeholder="Ask your creation something..." onkeypress="if(event.key==='Enter') generate()">
        <button onclick="generate()">SEND</button>
    </div>
</div>

<script>
    window.brainWeights = {};

    window.bulkLearn = function(textArray) {
        textArray.forEach(sentence => {
            // Logic: Treat punctuation as individual words
            let words = sentence.toLowerCase().replace(/([.!?])/g, " $1 ").split(/\s+/).filter(w=>w);
            for (let size = 1; size <= 5; size++) {
                for (let i = 0; i <= words.length - size; i++) {
                    let context = words.slice(i, i + size).join("_");
                    let nextWord = words[i + size];
                    if (nextWord) {
                        if (!window.brainWeights[context]) window.brainWeights[context] = {};
                        window.brainWeights[context][nextWord] = (window.brainWeights[context][nextWord] || 0) + 10;
                    }
                }
            }
        });
        updateHeatmap();
    };

    function generate() {
        let input = document.getElementById('user-in').value.toLowerCase().trim();
        if(!input) return;
        addLog("User", input);
        
        let words = input.replace(/([.!?])/g, " $1 ").split(/\s+/).filter(w => w);
        let res = [];
        let windowMem = words.slice(-5);

        for (let j = 0; j < 15; j++) {
            let picked = null;
            for (let lookback = Math.min(windowMem.length, 5); lookback >= 1; lookback--) {
                let key = windowMem.slice(-lookback).join("_");
                let options = window.brainWeights[key] || {};
                let choices = Object.keys(options).sort((a, b) => options[b] - options[a]);
                
                for (let c of choices) {
                    if (res.includes(c) && !".!?".includes(c)) continue; // Internal "Limit 1" Rule
                    picked = c; break;
                }
                if (picked) break;
            }

            // Fallback Jump-start
            if (!picked && j === 0) {
                for(let w of words) if(window.brainWeights[w]) { 
                    picked = Object.keys(window.brainWeights[w])[0]; break; 
                }
            }

            if (picked) {
                res.push(picked);
                if (".!?".includes(picked)) break; // Stop at Punctuation
                windowMem.push(picked);
                if (windowMem.length > 5) windowMem.shift();
            } else break;
        }
        
        let output = res.join(" ").replace(/\s+([.!?])/g, "$1");
        addLog("Johan", output || "...");
        document.getElementById('user-in').value = "";
    }

    function addLog(s, t) {
        let l = document.getElementById('log');
        let d = document.createElement('div');
        d.className = `msg ${s.toLowerCase()}`;
        d.innerHTML = `<strong>${s.toUpperCase()}:</strong> ${t}`;
        l.appendChild(d); l.scrollTop = l.scrollHeight;
    }

    function updateHeatmap() {
        const h = document.getElementById('heatmap'); h.innerHTML = "";
        Object.keys(window.brainWeights).forEach(k => {
            for(let next in window.brainWeights[k]) {
                h.innerHTML += `<div>${k.replace(/_/g,' ')} -> ${next}</div>`;
            }
        });
    }
</script>
</body>
</html>
