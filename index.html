<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Johan v23.5: Multi-Order Command Center</title>
    <style>
        :root { --bg: #050505; --neon: #00ffcc; --text: #d1d1d1; --accent: #bb86fc; --dark: #111; --good: #28a745; --bad: #dc3545; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        #sidebar { width: 550px; background: var(--dark); padding: 15px; border-right: 1px solid #333; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .panel { background: #161616; padding: 10px; border-radius: 6px; border: 1px solid #222; }
        .panel-label { font-size: 9px; color: #888; text-transform: uppercase; margin-bottom: 5px; display: block; font-weight: bold; }
        #heatmap { height: 250px; overflow-y: auto; background: #000; padding: 8px; border: 1px solid #333; font-family: monospace; font-size: 10px; }
        #change-board { height: 80px; overflow-y: auto; background: #080808; padding: 8px; border: 1px solid #222; font-family: monospace; font-size: 10px; color: var(--neon); }
        .heat-row { display: flex; justify-content: space-between; align-items: center; padding: 3px; border-bottom: 1px solid #222; }
        #chat { flex: 1; display: flex; flex-direction: column; padding: 20px; background: #0a0a0a; }
        #log { flex: 1; overflow-y: auto; background: rgba(0,0,0,0.5); border-radius: 8px; padding: 15px; margin-bottom: 15px; border: 1px solid #222; }
        .msg { margin-bottom: 10px; padding-left: 10px; border-left: 3px solid #444; }
        .user { border-left-color: var(--neon); color: var(--neon); }
        .ai { border-left-color: var(--accent); color: var(--accent); font-weight: bold; }
        button { cursor: pointer; border: none; border-radius: 4px; font-weight: bold; font-size: 9px; padding: 6px 10px; color: white; }
        .btn-good { background: var(--good); flex: 1; padding: 12px; }
        .btn-bad { background: var(--bad); flex: 1; padding: 12px; }
        .btn-snip { background: #411; color: #f44; }
        textarea, input { background: #000; color: var(--neon); border: 1px solid #333; padding: 8px; font-family: monospace; border-radius: 4px; width: 100%; box-sizing: border-box; }
    </style>
</head>
<body>

<div id="sidebar">
    <h3 style="color: var(--neon); margin: 0;">🧠 JOHAN v23.5: N-GRAM CORE</h3>

    <div class="panel">
        <span class="panel-label">⚖️ Global Rules</span>
        <input type="text" id="rule-input" value="limit 1" placeholder="ban python->fast">
    </div>

    <div class="panel">
        <span class="panel-label">📈 Change Board</span>
        <div id="change-board">System Ready...</div>
    </div>

    <div class="panel">
        <span class="panel-label">🔥 Context Heatmap (Clamped 1-5)</span>
        <div id="heatmap">No data...</div>
    </div>

    <div class="panel">
        <span class="panel-label">💾 Memory Core</span>
        <textarea id="data-io" style="height: 40px; margin-bottom:5px;" placeholder="JSON Data..."></textarea>
        <div style="display:flex; gap:5px;">
            <button style="background:#333" onclick="exportBrain()">Export</button>
            <button style="background:#333" onclick="importBrain()">Import</button>
            <button style="background:#400" onclick="resetBrain()">Wipe</button>
        </div>
    </div>
</div>

<div id="chat">
    <div id="log"><div class="msg system">v23.5 Online. BulkLoader ready in Console. Context Window: 5 words.</div></div>
    
    <div style="display:flex; gap:10px; margin-bottom: 15px;">
        <button class="btn-good" onclick="reward(2.0)">✅ REWARD (Reinforce Sequence)</button>
        <button class="btn-bad" onclick="reward(0.2)">❌ PUNISH (Break Sequence)</button>
    </div>

    <div style="display:flex; gap:10px;">
        <input type="text" id="user-in" style="flex:1; padding:15px; font-size:14px;" placeholder="Message Johan..." onkeypress="if(event.key==='Enter') generate()">
        <button onclick="generate()" style="background:var(--neon); color:black; padding:0 30px; border-radius:8px; font-weight:bold;">FIRE</button>
    </div>
</div>

<script>
    // CORE GLOBAL STATE
    window.brainWeights = {}; 
    window.lastSentenceKeys = []; 

    // THE BULK LOADER
    window.bulkLearn = function(textArray) {
        textArray.forEach(sentence => {
            let words = sentence.toLowerCase().replace(/[^\w\s]/g, "").trim().split(" ").filter(w=>w);
            for (let size = 1; size <= 5; size++) {
                for (let i = 0; i <= words.length - size; i++) {
                    let context = words.slice(i, i + size).join("_");
                    let nextWord = words[i + size];
                    if (nextWord) {
                        if (!window.brainWeights[context]) window.brainWeights[context] = {};
                        window.brainWeights[context][nextWord] = (window.brainWeights[context][nextWord] || 1.0) + 2.0;
                    }
                }
            }
        });
        logChange("Bulk training complete via console.");
        updateHeatmap();
    };

    function logChange(m) {
        const board = document.getElementById('change-board');
        board.innerHTML = `<div>[${new Date().toLocaleTimeString()}] ${m}</div>` + board.innerHTML;
    }

    function updateHeatmap() {
        const container = document.getElementById('heatmap');
        container.innerHTML = "";
        Object.keys(window.brainWeights).sort().forEach(p => {
            Object.keys(window.brainWeights[p]).forEach(c => {
                let w = window.brainWeights[p][c];
                let row = document.createElement('div');
                row.className = 'heat-row';
                row.innerHTML = `<span>[${p.replace(/_/g, ' ')}] → [${c}]</span>
                    <div style="display:flex; gap:5px; align-items:center;">
                        <span style="color:var(--neon)">${w.toFixed(1)}</span>
                        <button class="btn-snip" onclick="snip('${p}','${c}')">✂️</button>
                    </div>`;
                container.appendChild(row);
            });
        });
    }

    function snip(p, c) { delete window.brainWeights[p][c]; updateHeatmap(); logChange(`Snipped: ${p}->${c}`); }

function generate() {
    let input = document.getElementById('user-in').value.toLowerCase().trim();
    if(!input) return;
    addLog("User", input);
    
    let words = input.replace(/[^\w\s]/g, "").split(" ").filter(w => w);
    let res = [];
    let windowMem = words.slice(-5);

    for (let j = 0; j < 12; j++) {
        let picked = null;
        
        for (let lookback = Math.min(windowMem.length, 5); lookback >= 1; lookback--) {
            let key = windowMem.slice(-lookback).join("_");
            let options = window.brainWeights[key] || {};
            let choices = Object.keys(options);
            
            if (choices.length > 0) {
                // THE FUZZY LOGIC: 80% chance for the "Best" word, 20% for a "Random" one
                if (Math.random() > 0.2) {
                    picked = choices.sort((a, b) => options[b] - options[a])[0];
                } else {
                    picked = choices[Math.floor(Math.random() * choices.length)];
                }
                break;
            }
        }

        if (picked) {
            res.push(picked);
            windowMem.push(picked);
            if (windowMem.length > 5) windowMem.shift();
        } else break;
    }
    
    addLog("Johan", res.join(" ") || "...");
    updateHeatmap();
    document.getElementById('user-in').value = "";
}
    function reward(m) {
        window.lastSentenceKeys.forEach(pair => {
            if(window.brainWeights[pair.p] && window.brainWeights[pair.p][pair.c]) {
                window.brainWeights[pair.p][pair.c] *= m;
            }
        });
        logChange(`Applied x${m} multiplier to last path.`);
        updateHeatmap();
    }

    function addLog(s, t) {
        let l = document.getElementById('log');
        let d = document.createElement('div');
        d.className = `msg ${s.toLowerCase()}`;
        d.innerHTML = `<strong>${s.toUpperCase()}:</strong> ${t}`;
        l.appendChild(d); l.scrollTop = l.scrollHeight;
    }

    function exportBrain() { document.getElementById('data-io').value = JSON.stringify(window.brainWeights); }
    function importBrain() { 
        try { window.brainWeights = JSON.parse(document.getElementById('data-io').value); updateHeatmap(); logChange("Memory Restored"); }
        catch(e) { alert("Invalid JSON"); }
    }
    function resetBrain() { if(confirm("Wipe?")) { window.brainWeights = {}; updateHeatmap(); addLog("System", "Memory Wiped."); } }
</script>
</body>
</html>
